<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tsurubami desktop pet</title>
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <main id="app" aria-label="tsurubami desktop pet">
      <div id="bubble" class="bubble" role="status" aria-live="polite"></div>

      <button id="settings-toggle" class="settings-toggle" type="button" aria-label="打开设置">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.35 7.35 0 0 0-1.63-.94l-.36-2.54a.5.5 0 0 0-.5-.42h-3.84a.5.5 0 0 0-.5.42l-.36 2.54c-.58.22-1.12.53-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.7 8.84a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.82 14.52a.5.5 0 0 0-.12.64l1.92 3.32a.5.5 0 0 0 .6.22l2.39-.96c.5.4 1.05.72 1.63.94l.36 2.54a.5.5 0 0 0 .5.42h3.84a.5.5 0 0 0 .5-.42l.36-2.54c.58-.22 1.12-.53 1.63-.94l2.39.96a.5.5 0 0 0 .6-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58ZM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Z" />
        </svg>
      </button>

      <section id="settings-panel" class="settings-panel" hidden aria-label="桌宠设置">
        <div class="settings-group">
          <label class="setting-row">
            <span>自动说话</span>
            <input id="setting-auto-talk" type="checkbox" data-setting-key="autoTalk" />
          </label>

          <div class="setting-stack">
            <span class="setting-label">活跃度</span>
            <div class="segmented-control" role="radiogroup" aria-label="活跃度">
              <button type="button" class="segment-button" data-setting-key="activityLevel" data-setting-value="low">低</button>
              <button type="button" class="segment-button" data-setting-key="activityLevel" data-setting-value="medium">中</button>
              <button type="button" class="segment-button" data-setting-key="activityLevel" data-setting-value="high">高</button>
            </div>
          </div>

          <label class="setting-row">
            <span>深夜安静模式</span>
            <input id="setting-night-mode" type="checkbox" data-setting-key="nightMode" />
          </label>

          <label class="setting-row">
            <span>提醒功能</span>
            <input id="setting-reminders-enabled" type="checkbox" data-setting-key="remindersEnabled" />
          </label>

          <label class="setting-row">
            <span>麦克风感知</span>
            <input id="setting-microphone-enabled" type="checkbox" data-setting-key="microphoneEnabled" />
          </label>

          <div class="setting-stack">
            <span class="setting-label">麦克风敏感度</span>
            <div class="segmented-control" role="radiogroup" aria-label="麦克风敏感度">
              <button type="button" class="segment-button" data-setting-key="microphoneSensitivity" data-setting-value="low">低</button>
              <button type="button" class="segment-button" data-setting-key="microphoneSensitivity" data-setting-value="medium">中</button>
              <button type="button" class="segment-button" data-setting-key="microphoneSensitivity" data-setting-value="high">高</button>
            </div>
          </div>

          <div class="setting-stack">
            <span class="setting-label">麦克风状态</span>
            <div id="microphone-status" class="microphone-status" data-status="idle">
              <span class="microphone-status-dot" aria-hidden="true"></span>
              <span class="microphone-status-text">未启用</span>
            </div>
            <div class="microphone-note">仅检测环境音量，不记录内容</div>
          </div>
        </div>

        <div class="settings-group settings-actions">
          <button type="button" class="action-button" data-settings-action="test-reminder">测试提醒</button>
          <button type="button" class="action-button" data-settings-action="request-microphone">请求麦克风</button>
          <button type="button" class="action-button" data-settings-action="reset-position">重置位置</button>
          <button type="button" class="action-button" data-settings-action="toggle-visibility">隐藏桌宠</button>
          <button type="button" class="action-button subtle" data-settings-action="close">收起</button>
        </div>
      </section>

      <button id="pet-launcher" class="pet-launcher" type="button" hidden>叫我出来</button>

      <section id="pet-root" class="pet" data-drag-handle>
        <div id="effects" class="effects" aria-hidden="true"></div>

        <img id="pet-float" class="pet-float" src="/src/assets/hecan-float.png" alt="" />
        <img id="pet-image" class="pet-image" src="/src/assets/hecan.png" alt="鹤喰" />
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
